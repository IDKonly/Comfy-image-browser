name: "Release Build"

on:
  push:
    # v1.0.0과 같은 태그가 푸시될 때 실행됩니다.
    tags:
      - 'v*'
  workflow_dispatch:
    # 수동 실행 시 버전 업데이트 유형을 선택할 수 있게 합니다.
    inputs:
      version_update:
        description: 'Select version update type (bumps version and commits before build)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  publish-tauri:
    permissions:
      contents: write # 403 에러 해결 및 릴리즈 생성을 위한 권한
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      # 수동 실행 시 버전 업데이트 처리 (Node.js 스크립트로 package.json과 tauri.conf.json 동시 업데이트)
      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_update != 'none'
        run: |
          # package.json 버전 업데이트
          npm version ${{ github.event.inputs.version_update }} --no-git-tag-version
          
          # 업데이트된 버전 추출
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          # tauri.conf.json 버전 동기화
          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.version = '$NEW_VERSION';
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "

      # 변경된 버전 파일을 저장소에 커밋 및 태그 생성
      - name: Git Auto Commit
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_update != 'none'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ env.NEW_VERSION }}"
          file_pattern: 'package*.json src-tauri/tauri.conf.json'
          tagging_message: "v${{ env.NEW_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 릴리즈에 사용할 태그 결정 (태그 푸시인 경우 ref_name, 수동 업데이트인 경우 생성된 새 버전)
      - name: Set Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version_update }}" != "none" ]; then
            echo "RELEASE_TAG=v${{ env.NEW_VERSION }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "App ${{ env.RELEASE_TAG }}"
          releaseBody: "Automated release from GitHub Actions. Version update: ${{ github.event.inputs.version_update || 'manual tag' }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
