name: "Release Build"

on:
  push:
    # v1.0.0과 같은 태그가 푸시될 때 실행됩니다.
    tags:
      - 'v*'
  workflow_dispatch:
    # 수동 실행 시 버전 업데이트 유형을 선택할 수 있게 합니다.
    inputs:
      version_update:
        description: 'Select version update type (bumps version and commits before build)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  # 1. 버전을 올리고 태그를 생성하는 사전 준비 작업 (단 1번만 실행)
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.set_tag.outputs.RELEASE_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js (for bumping version)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_update != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_update != 'none'
        run: |
          npm version ${{ github.event.inputs.version_update }} --no-git-tag-version
          
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.version = '$NEW_VERSION';
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "

      - name: Git Auto Commit
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_update != 'none'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ env.NEW_VERSION }}"
          file_pattern: 'package*.json src-tauri/tauri.conf.json'
          tagging_message: "v${{ env.NEW_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Release Tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version_update }}" != "none" ]; then
            echo "RELEASE_TAG=v${{ env.NEW_VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  # 2. 실제 각 운영체제별 빌드 및 릴리즈 업로드 작업
  publish-tauri:
    needs: prepare-release # prepare-release가 끝난 후 실행되도록 대기
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 변경/생성된 새 버전의 태그 코드를 불러옵니다.
          ref: ${{ needs.prepare-release.outputs.release_tag }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.release_tag }}
          releaseName: "App ${{ needs.prepare-release.outputs.release_tag }}"
          releaseBody: "Automated release from GitHub Actions. Version update: ${{ github.event.inputs.version_update || 'manual tag' }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
