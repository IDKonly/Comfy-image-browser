<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComfyView Mobile Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        
        #feedContainer {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: calc(100dvh - 3.5rem);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            display: block;
        }

        .feed-post {
            scroll-snap-align: start;
            height: calc(100dvh - 3.5rem);
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: hidden;
            transition: opacity 0.3s ease, height 0.3s ease, transform 0.3s ease;
            flex-shrink: 0;
        }

        .post-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .post-image.loaded { opacity: 1; }

        .action-sidebar {
            position: absolute;
            bottom: 4rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 10;
            transition: all 0.3s ease;
        }
        
        .sidebar-right { right: 1rem; }
        .sidebar-left { left: 1rem; }

        .action-btn {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn-keep { color: #3b82f6; border-color: rgba(59, 130, 246, 0.3); }
        .btn-trash { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        .btn-icon { font-size: 1.25rem; }
        .btn-label { font-size: 0.5rem; font-weight: 900; text-transform: uppercase; margin-top: 2px; }

        .post-info {
            position: absolute;
            bottom: 1.5rem;
            max-width: 60%;
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .info-left { left: 1rem; text-align: left; }
        .info-right { right: 1rem; text-align: right; }

        .status-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            transform: scale(0.8);
            z-index: 20;
        }
        .status-overlay.show { opacity: 1; transform: scale(1); }
        .status-keep { color: #3b82f6; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .status-trash { color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

        #indexDisplay:active { transform: scale(0.95) translateX(-50%); }
    </style>
</head>
<body class="overflow-x-hidden fixed inset-0 flex flex-col">
    
    <header class="h-14 border-b border-white/5 flex items-center justify-between px-4 bg-neutral-900/90 backdrop-blur-md z-40 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-blue-600 rounded flex items-center justify-center text-white text-[10px] font-black italic">CV</div>
            <h1 id="title" class="text-xs font-black uppercase tracking-widest italic text-neutral-300">ComfyView</h1>
        </div>

        <div id="indexDisplay" onclick="jumpToIndex()" class="hidden absolute left-1/2 -translate-x-1/2 flex flex-col items-center cursor-pointer transition-transform px-4 py-1">
            <span id="counter" class="text-[10px] font-mono font-black text-blue-500 tracking-tighter">0 / 0</span>
            <div class="w-12 h-0.5 bg-white/5 rounded-full overflow-hidden mt-0.5">
                <div id="progressBar" class="h-full bg-blue-600 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="swapBtn" class="text-[8px] font-black uppercase text-neutral-500 border border-white/10 px-2 py-1 rounded-lg">Side</button>
            <button id="backBtn" class="hidden text-[10px] font-black uppercase text-blue-500 px-2 py-1 bg-blue-500/10 rounded-lg">Back</button>
        </div>
    </header>

    <main id="content" class="flex-1 relative overflow-hidden flex flex-col">
        <div id="rootView" class="p-4 space-y-6 overflow-y-auto flex-1">
            <div class="space-y-4">
                <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-500">Authorized Folders</h2>
                <div id="authList" class="space-y-3"></div>
            </div>
            <div class="space-y-4">
                <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-neutral-500">Recent Folders</h2>
                <div id="recentList" class="space-y-3"></div>
            </div>
        </div>

        <div id="browseView" class="hidden p-4 space-y-4 overflow-y-auto flex-1">
            <div class="flex items-center justify-between">
                <h2 id="browseTitle" class="text-[10px] font-black uppercase tracking-[0.2em] text-neutral-400 truncate flex-1 mr-4">Folder</h2>
                <button id="upBtn" class="text-[8px] font-black uppercase text-blue-500 bg-blue-500/10 px-3 py-1 rounded-full">Up ⬆️</button>
            </div>
            <div id="browseList" class="space-y-3"></div>
            <div id="browseImageList" class="flex flex-col gap-3 pt-4 border-t border-white/5">
                <button id="resumeBtn" class="hidden py-4 bg-neutral-800 border border-white/10 text-blue-400 rounded-2xl font-black uppercase tracking-widest text-xs active:scale-95 transition-all">Resume Session</button>
                <button id="startGradingBtn" class="py-4 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg shadow-blue-600/20 active:scale-95 transition-all">Start Feed</button>
            </div>
        </div>

        <div id="viewerView" class="hidden flex-1 relative bg-black">
            <div id="feedContainer"></div>
        </div>
    </main>

    <div id="preloadContainer" style="display:none"></div>

    <script>
        const state = {
            view: 'root',
            pathStack: [],
            currentFolderPath: null,
            images: [],
            renderedCount: 0,
            chunkSize: 5,
            visibleIndex: 0,
            btnSide: localStorage.getItem('cv_btn_side') || 'right',
            visibilityObserver: null,
            infiniteObserver: null
        };

        const $ = id => document.getElementById(id);

        async function init() {
            try {
                const resp = await fetch('/api/state');
                const data = await resp.json();
                renderRoots(data.authorizedFolders || [], data.recentFolders || []);
            } catch (e) { console.error("Init failed:", e); }
        }

        function renderRoots(auth, recent) {
            const formatPath = p => {
                const parts = p.split(/[\\/]/).filter(Boolean);
                return parts.length > 2 ? '.../' + parts.slice(-2).join('/') : parts.join('/');
            };
            $('authList').innerHTML = auth.map(f => `<button onclick="enterFolder('${f.replace(/\\/g, '\\\\')}')" class="w-full p-4 bg-blue-600/5 border border-blue-500/10 rounded-2xl text-left active:scale-[0.98] transition-all"><p class="text-[10px] font-black uppercase text-blue-500 mb-1">Permanent Root</p><p class="text-xs font-medium text-neutral-300 truncate">${formatPath(f)}</p></button>`).join('');
            if (auth.length === 0) $('authList').innerHTML = '<p class="text-[8px] text-neutral-600 italic">No authorized folders set in Settings.</p>';
            $('recentList').innerHTML = recent.map(f => `<button onclick="enterFolder('${f.replace(/\\/g, '\\\\')}')" class="w-full p-4 bg-white/5 border border-white/5 rounded-2xl text-left active:scale-[0.98] transition-all"><p class="text-[10px] font-black uppercase text-neutral-500 mb-1">Recent Entry</p><p class="text-xs font-medium text-neutral-300 truncate">${formatPath(f)}</p></button>`).join('');
            if (recent.length === 0) $('recentList').innerHTML = '<p class="text-[8px] text-neutral-600 italic">No recent history.</p>';
        }

        async function enterFolder(path) {
            state.view = 'browse';
            state.currentFolderPath = path;
            state.pathStack.push(path);
            $('rootView').classList.add('hidden');
            $('browseView').classList.remove('hidden');
            $('backBtn').classList.remove('hidden');
            $('title').classList.add('hidden');
            await refreshBrowse();
        }

        async function refreshBrowse() {
            try {
                const path = state.currentFolderPath;
                const parts = path.split(/[\\/]/).filter(Boolean);
                $('browseTitle').textContent = parts.slice(-2).join(' / ') || path;
                
                const subfolders = await (await fetch('/api/subfolders?path=' + encodeURIComponent(path))).json();
                state.images = await (await fetch('/api/images?folder=' + encodeURIComponent(path))).json();
                
                $('browseList').innerHTML = subfolders.map(f => `<button onclick="navigateInto('${f.path.replace(/\\/g, '\\\\')}')" class="w-full p-3 bg-white/5 border border-white/5 rounded-xl text-left flex items-center gap-3"><span class="text-lg">📁</span><span class="text-xs font-medium text-neutral-300 truncate">${f.name}</span></button>`).join('');
                
                if (state.images && state.images.length > 0) {
                    $('startGradingBtn').classList.remove('hidden');
                    $('startGradingBtn').innerHTML = 'Start Feed (' + state.images.length + ' images)';
                    const savedIndex = localStorage.getItem('cv_pos_' + path);
                    if (savedIndex && parseInt(savedIndex) > 0 && parseInt(savedIndex) < state.images.length) {
                        $('resumeBtn').classList.remove('hidden');
                        $('resumeBtn').innerHTML = 'Resume from #' + (parseInt(savedIndex) + 1);
                        $('resumeBtn').onclick = () => startSession(parseInt(savedIndex));
                    } else { $('resumeBtn').classList.add('hidden'); }
                } else { $('startGradingBtn').classList.add('hidden'); $('resumeBtn').classList.add('hidden'); }
            } catch (e) { alert("Failed to load folder content"); }
        }

        function navigateInto(path) { state.currentFolderPath = path; state.pathStack.push(path); refreshBrowse(); }
        $('upBtn').onclick = () => {
            if (state.pathStack.length > 1) { state.pathStack.pop(); state.currentFolderPath = state.pathStack[state.pathStack.length - 1]; refreshBrowse(); }
            else { goBack(); }
        };

        function startSession(startIndex = 0) {
            if (!state.images || state.images.length === 0) { alert("No images to display"); return; }
            
            state.view = 'viewer';
            $('browseView').classList.add('hidden');
            $('viewerView').classList.remove('hidden');
            $('indexDisplay').classList.remove('hidden');
            $('indexDisplay').classList.add('flex');
            
            const container = $('feedContainer');
            container.innerHTML = '<div id="feedEndMarker" class="h-40 flex items-center justify-center text-neutral-500 text-[10px] font-black uppercase tracking-widest">End of folder</div>';
            
            state.renderedCount = startIndex;
            state.visibleIndex = startIndex;
            updateCounter();
            
            // Re-setup observers
            if (state.infiniteObserver) state.infiniteObserver.disconnect();
            if (state.visibilityObserver) state.visibilityObserver.disconnect();

            state.infiniteObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) loadMorePosts();
            }, { root: container, rootMargin: '0px 0px 1000px 0px' });

            state.visibilityObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
                        const idx = parseInt(entry.target.dataset.index);
                        if (!isNaN(idx)) {
                            state.visibleIndex = idx;
                            updateCounter();
                            localStorage.setItem('cv_pos_' + state.currentFolderPath, idx);
                        }
                    }
                });
            }, { root: container, threshold: 0.6 });

            loadMorePosts();
            state.infiniteObserver.observe($('feedEndMarker'));

            // Scroll to the first post if not at 0
            if (startIndex > 0) {
                setTimeout(() => {
                    const firstPost = container.querySelector('.feed-post');
                    if (firstPost) firstPost.scrollIntoView();
                }, 100);
            }
        }

        $('startGradingBtn').onclick = () => startSession(0);

        function createPostElement(imgData, index) {
            const div = document.createElement('div');
            div.className = 'feed-post';
            div.dataset.index = index;
            div.dataset.path = imgData.path;
            div.id = 'post-' + index;

            const sideClass = state.btnSide === 'right' ? 'sidebar-right' : 'sidebar-left';
            const infoClass = state.btnSide === 'right' ? 'info-left' : 'info-right';

            div.innerHTML = `
                <img class="post-image" src="/api/image?path=${encodeURIComponent(imgData.path)}" onload="this.classList.add('loaded')">
                <div class="status-overlay" id="status-${index}"><span id="statusText-${index}"></span></div>
                <div class="post-info ${infoClass}">
                    <p class="text-white text-[10px] font-bold truncate opacity-80">${imgData.name}</p>
                </div>
                <div class="action-sidebar ${sideClass}">
                    <button onclick="handleFeedAction(${index}, 'keep')" class="action-btn btn-keep">
                        <span class="btn-icon">⭐</span><span class="btn-label">Keep</span>
                    </button>
                    <button onclick="handleFeedAction(${index}, 'trash')" class="action-btn btn-trash">
                        <span class="btn-icon">🗑️</span><span class="btn-label">Trash</span>
                    </button>
                </div>
            `;
            return div;
        }

        function loadMorePosts() {
            if (state.renderedCount >= state.images.length) return;
            const container = $('feedContainer');
            const endMarker = $('feedEndMarker');
            const end = Math.min(state.renderedCount + state.chunkSize, state.images.length);
            for (let i = state.renderedCount; i < end; i++) {
                const post = createPostElement(state.images[i], i);
                container.insertBefore(post, endMarker);
                if (state.visibilityObserver) state.visibilityObserver.observe(post);
            }
            state.renderedCount = end;
            if (state.renderedCount >= state.images.length) endMarker.textContent = "✨ End of Feed";
        }

        function updateCounter() {
            const current = state.visibleIndex + 1;
            const total = state.images.length;
            $('counter').textContent = current + ' / ' + total;
            $('progressBar').style.width = (current / total * 100) + '%';
        }

        async function handleFeedAction(index, action) {
            const post = $('post-' + index);
            if (!post) return;
            const path = post.dataset.path;
            const statusOverlay = $('status-' + index);
            const statusText = $('statusText-' + index);

            if (action === 'keep') { statusText.textContent = 'KEEP'; statusOverlay.className = 'status-overlay status-keep show'; }
            else { statusText.textContent = 'TRASH'; statusOverlay.className = 'status-overlay status-trash show'; }

            try { 
                const response = await fetch('/api/action', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ path, action }) 
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Action failed:", errorText);
                    alert("Action failed: " + errorText);
                    statusOverlay.classList.remove('show');
                    return;
                }
            } catch (e) {
                console.error("Network error:", e);
                alert("Network error. Check connection.");
                statusOverlay.classList.remove('show');
                return;
            }

            setTimeout(() => {
                post.style.opacity = '0';
                post.style.transform = 'scale(0.9) translateY(-50px)';
                setTimeout(() => {
                    if (state.visibilityObserver) state.visibilityObserver.unobserve(post);
                    post.remove();
                    if ($('feedContainer').querySelectorAll('.feed-post').length < 3) loadMorePosts();
                    
                    // Recalculate visible index
                    const posts = Array.from($('feedContainer').querySelectorAll('.feed-post'));
                    if (posts.length > 0) {
                        state.visibleIndex = parseInt(posts[0].dataset.index);
                        updateCounter();
                    }
                }, 300);
            }, 300);
        }

        $('swapBtn').onclick = () => {
            state.btnSide = state.btnSide === 'right' ? 'left' : 'right';
            localStorage.setItem('cv_btn_side', state.btnSide);
            document.querySelectorAll('.action-sidebar').forEach(s => { s.classList.toggle('sidebar-right'); s.classList.toggle('sidebar-left'); });
            document.querySelectorAll('.post-info').forEach(i => { i.classList.toggle('info-left'); i.classList.toggle('info-right'); });
        };

        function jumpToIndex() {
            if (state.view !== 'viewer') return;
            const input = prompt('Jump to index (1 - ' + state.images.length + '):', state.visibleIndex + 1);
            if (input) {
                const newIdx = parseInt(input) - 1;
                if (!isNaN(newIdx) && newIdx >= 0 && newIdx < state.images.length) startSession(newIdx);
            }
        }

        $('backBtn').onclick = () => { if (state.view === 'viewer') goBackToBrowse(); else goBack(); };
        function goBackToBrowse() {
            state.view = 'browse'; $('viewerView').classList.add('hidden'); $('browseView').classList.remove('hidden');
            $('indexDisplay').classList.add('hidden'); $('indexDisplay').classList.remove('flex');
            if (state.infiniteObserver) state.infiniteObserver.disconnect();
            if (state.visibilityObserver) state.visibilityObserver.disconnect();
            refreshBrowse();
        }
        function goBack() {
            state.view = 'root'; state.pathStack = [];
            $('rootView').classList.remove('hidden'); $('browseView').classList.add('hidden');
            $('viewerView').classList.add('hidden'); $('backBtn').classList.add('hidden');
            $('indexDisplay').classList.add('hidden'); $('indexDisplay').classList.remove('flex');
            $('title').classList.remove('hidden'); init();
        }

        init();
    </script>
</body>
</html>
